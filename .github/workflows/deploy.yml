name: Deploy to Production

on:
  pull_request:
    branches: ["main"]
    types: [closed] # triggers when a PR is closed or merged into 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only run this job if the PR was merged (not just closed)
    if: github.event.pull_request.merged == true

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v3

      - name: Deploy to Production in Coolify
        run: |
          echo "Deploying to Production in Coolify..."
          curl -f -X GET \
            "https://coolify.adtalk.org/api/v1/deploy?uuid=${{ secrets.COOLIFY_PRODUCTION_APP_ID }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_PRODUCTION_TOKEN }}"
